name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository or to any GitHub API.
permissions:
  contents: read

jobs:
  build-and-test:
    name: build, generator determinism, unit + ABI tests (OCaml ${{ matrix.ocaml }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 5.5.1 is the development version; 5.2.0 is the declared floor in
        # dune-project (the base OxCaml is built on) and must keep working.
        ocaml: ["5.5.1", "5.2.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # libffi + pkg-config are needed to *build* ctypes-foreign, not to build
      # these bindings; the C compiler is for test/abi's probe, which is
      # compiled against the vendored headers.  No Vulkan, no wgpu-native and
      # no Rust toolchain are needed by this job.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libffi-dev pkg-config gcc

      - name: Set up OCaml ${{ matrix.ocaml }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml }}

      # wgpu.opam is generated by dune from dune-project but committed, so the
      # dependencies can be resolved before dune exists in the switch.
      - name: Install opam dependencies
        run: opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build -j 2

      # The committed lib/generated/*.ml must be exactly what gen/gen.ml
      # produces from the vendored headers (DESIGN.md §7.3).
      - name: Generated code is reproducible (dune build @gen)
        run: opam exec -- dune build -j 2 @gen

      # Unit checks (pin, naming, header rescan, vendored header checksums,
      # loader diagnostics) plus the ABI/defaults diff between a C probe
      # compiled from the vendored headers and the generated bindings.
      - name: Unit and ABI tests (isolated dependencies)
        run: opam exec -- dune build -j 2 @runtest --sandbox copy

      - name: Fail if anything in the tree changed
        run: git diff --exit-code

  gpu-lavapipe:
    name: headless compute + render on lavapipe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # mesa-vulkan-drivers brings Mesa's lavapipe software rasteriser, which
      # is the adapter these tests run on; vulkan-tools is diagnostics only.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libffi-dev pkg-config gcc mesa-vulkan-drivers vulkan-tools unzip curl

      - name: Set up OCaml 5.5.1
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5.1"

      - name: Install opam dependencies
        run: opam install . --deps-only --with-test

      # Downloads the pinned release archive and verifies its SHA-256 against
      # vendor/wgpu-native/pin.txt; it refuses to install on a mismatch, so
      # this step is also the checksum test.
      - name: Install the pinned wgpu-native (checksummed)
        run: opam exec -- dune exec scripts/fetch_wgpu_native.exe

      - name: Locate the lavapipe ICD manifest
        run: |
          icd=$(find /usr/share/vulkan/icd.d -iname 'lvp_icd*.json' -print -quit)
          if [ -z "$icd" ]; then
            echo "::error::lvp_icd*.json not found under /usr/share/vulkan/icd.d (mesa-vulkan-drivers layout changed?)"
            find /usr/share/vulkan -maxdepth 2 || true
            exit 1
          fi
          echo "Found lavapipe ICD manifest: $icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"

      - name: Vulkan diagnostics (informational)
        continue-on-error: true
        run: vulkaninfo --summary

      # test_device, test_compute (exact numerical readback), test_render
      # (exact pixel readback), test_errors, test_gc_lifetime,
      # test_callback_safety.
      - name: GPU tests (dune build @gpu)
        run: opam exec -- dune build -j 2 @gpu

      - name: Example — headless compute
        run: |
          opam exec -- dune exec examples/headless_compute.exe | tee compute.out
          grep -qx 'out: 3 5 7 9 11 13 15 17' compute.out

      - name: Example — offscreen render
        run: |
          opam exec -- dune exec examples/offscreen_render.exe | tee render.out
          grep -q 'bottom-left pixel: r=255 g=0 b=0 a=255' render.out
          grep -q 'top-right pixel:   r=0 g=0 b=255 a=255' render.out
